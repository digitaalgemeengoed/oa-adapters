<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demo-werkomgeving — Office Assistent</title>
  </head>
  <body>
    <div class="venster">
      <header class="titelbalk">
        <span class="app">Demo-tekstverwerker</span>
        <label class="soort">Werkomgeving
          <select id="soort">
            <option value="rijk">rijk: alle vermogens</option>
            <option value="beperkt">beperkt: alleen de drie basisvermogens</option>
          </select>
        </label>
        <a href="/">Startpagina</a>
      </header>
      <div class="werkbalk" role="toolbar" aria-label="Werkbalk">
        <button type="button" id="nieuw">Nieuw</button>
        <button type="button" id="opslaan" title="Ctrl+S">Opslaan</button>
        <span class="scheiding"></span>
        <button type="button" data-opdracht="formatBlock:h1">Kop 1</button>
        <button type="button" data-opdracht="formatBlock:h2">Kop 2</button>
        <button type="button" data-opdracht="formatBlock:h3">Kop 3</button>
        <button type="button" data-opdracht="formatBlock:p">Alinea</button>
        <button type="button" data-opdracht="bold"><b>V</b></button>
        <button type="button" data-opdracht="italic"><i>C</i></button>
        <button type="button" data-opdracht="insertUnorderedList">Lijst</button>
      </div>
      <main class="werkvlak">
        <div class="pagina">
          <article id="document" contenteditable="true" spellcheck="true" lang="nl" aria-label="Document"></article>
        </div>
        <aside id="paneel" aria-label="Assistent">
        <div class="oa-laden oa-laden-vast" role="status" aria-live="polite">
          <style>
            .oa-laden-vast { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 32px 12px; text-align: center; font: 15px/1.4 system-ui, sans-serif; color: #1d1d1b; }
            section:not([hidden]) ~ * .oa-laden-vast, section:not([hidden]) ~ .oa-laden-vast { display: none; }
            .oa-laden-vast .c { width: 36px; height: 36px; border-radius: 50%; border: 3px solid rgba(26, 94, 168, 0.2); border-top-color: #1a5ea8; animation: oa-laden-draai 0.9s linear infinite; }
            .oa-laden-vast p { margin: 0; }
            .oa-laden-vast .t { font-weight: 600; }
            .oa-laden-vast .s { font-size: 13px; color: #555; max-width: 30em; }
            .oa-laden-vast .b { width: min(240px, 80%); height: 6px; border-radius: 3px; background: rgba(26, 94, 168, 0.15); overflow: hidden; }
            .oa-laden-vast .b span { display: block; width: 40%; height: 100%; background: #1a5ea8; animation: oa-laden-schuif 1.4s ease-in-out infinite; }
            @keyframes oa-laden-draai { to { transform: rotate(360deg); } }
            @keyframes oa-laden-schuif { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
            @media (prefers-reduced-motion: reduce) { .oa-laden-vast .c, .oa-laden-vast .b span { animation-duration: 4s; } }
          </style>
          <div class="c" aria-hidden="true"></div>
          <p class="t">De Assistent wordt geladen…</p>
          <div class="b" aria-hidden="true"><span></span></div>
          <p class="s">Stap 1 van 2: de Assistent ophalen. Over een trage (mobiele) verbinding kan dit even duren.</p>
        </div>
      </aside>
      </main>
      <footer class="statusbalk"><span id="status" role="status">Gereed</span></footer>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
